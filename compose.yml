---
services:
  db_service:
    image: srivardhan22/pyproj:db_image
    networks:
      - mynet
    deploy:
      replicas: 1
    ports:
      - "3306:3306"

  auth_service:
    image: srivardhan22/pyproj:auth_image
    deploy:
      replicas: 1
    networks:
      - mynetwork
    ports:
      - "5001:5001"
    
    depends_on:
      - db_service

  book_service:
    image: srivardhan22/pyproj:book_image
    deploy:
      replicas: 1
    networks:
      - mynetwork
    ports:
      - "5002:5002"
    
    depends_on:
      - db_service

  borrow_service:
    image: srivardhan22/pyproj:borrow_image
    deploy:
      replicas: 1
    networks:
      - mynetwork
    ports:
      - "5003:5003"
    
    depends_on:
      - db_service

  frontend:
    image: srivardhan22/pyproj:frontend
    deploy:
      replicas: 1
    networks:
      - mynetwork
    ports:
      - "5000:5000"
    
    depends_on:
      - auth_service
      - book_service
      - borrow_service
  
  networks:
    mynetwork:
      driver: overlay
